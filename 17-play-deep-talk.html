<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EverLove - Deep Talk</title>
    <link rel="stylesheet" href=".design/device-chrome.css">
    <link rel="stylesheet" href=".design/device-ios.css">
    <style>
        /* Per-mockup design tokens. design-system.html (if present in the
           working directory) overrides these. Keep in sync with
           components/ios/01-base-tokens.md. */
        :root {
            --color-bg: #FFFFFF;
            --color-text: #000000;
            --color-text-secondary: #6B7280;
            --color-island: #000000;
            --font-system: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            /* iOS HIG type ramp */
            --text-caption2:    11px;
            --text-caption1:    12px;
            --text-footnote:    13px;
            --text-subheadline: 15px;
            --text-callout:     16px;
            --text-body:        17px;
            --text-title3:      20px;
            --text-title2:      22px;
            --text-title1:      28px;
            --text-largetitle:  34px;
            --text-md:          var(--text-body);
        }
:root{
  --color-bg:#FFFFFF; --color-text:#2A0F2E; --color-text-secondary:#85708A;
  --plum:#4D1655; --plum-deep:#2F0D36; --plum-700:#6A2573;
  --orchid:#D985D0; --orchid-deep:#B95AB0; --orchid-soft:#EEC3E9;
  --blush:#F8E3F5; --blush-50:#FDF4FC; --line:#F0DEEC;
  --ink:#2A0F2E; --muted:#85708A;
  --ok:#2FB26B; --ok-bg:#E3F6EB; --gold:#F2B03B; --rose:#F0507F;
  --shadow-card:0 6px 24px rgba(77,22,85,.08);
  --shadow-btn:0 8px 20px rgba(77,22,85,.28);
}
.device{color:var(--ink)}
.screen{min-height:932px;display:flex;flex-direction:column;position:relative}
.wash{background:linear-gradient(180deg,#F5CFF0 0%,#FAE4F7 28%,#FFFFFF 62%)}
.av{border-radius:50%;display:block;flex-shrink:0}
button{font-family:inherit;color:inherit}

.t-large{font-size:var(--text-largetitle);font-weight:700;line-height:1.08;letter-spacing:-.03em;color:var(--plum-deep)}
.t-title{font-size:var(--text-title1);font-weight:700;line-height:1.14;letter-spacing:-.028em;color:var(--plum-deep)}
.t-sub{font-size:var(--text-subheadline);line-height:1.35;color:var(--muted)}

.btn{height:54px;width:100%;border:none;border-radius:27px;font-size:var(--text-body);font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn-plum{background:var(--plum);color:#fff;box-shadow:var(--shadow-btn)}
.btn-soft{background:rgba(255,255,255,.72);color:var(--plum);box-shadow:inset 0 0 0 1px rgba(77,22,85,.10)}
.btn-orchid{background:var(--orchid);color:var(--plum-deep)}
.btn-white{background:#fff;color:var(--plum)}
.btn[disabled]{opacity:.4;box-shadow:none}
.link{background:none;border:none;font-size:var(--text-subheadline);font-weight:600;color:var(--plum);cursor:pointer;min-height:44px}

.ibtn{width:44px;height:44px;border-radius:50%;border:none;background:#fff;color:var(--plum);
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(77,22,85,.10);cursor:pointer;position:relative;flex-shrink:0}
.ibtn.ghost{background:none;box-shadow:none}
.dot{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 2px #fff}

.card{background:#fff;border-radius:24px;box-shadow:var(--shadow-card)}
.chip{height:32px;padding:0 12px;border-radius:16px;background:var(--blush);color:var(--plum);
  font-size:var(--text-footnote);font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:none}
.chip.on{background:var(--plum);color:#fff}
.chip svg{flex-shrink:0}
.seg{display:flex;gap:6px;flex:1}
.seg i{flex:1;height:4px;border-radius:2px;background:rgba(77,22,85,.14)}
.seg i.on{background:var(--plum)}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:0 20px 12px}
.sec h2{font-size:var(--text-title3);font-weight:700;letter-spacing:-.02em;color:var(--plum-deep)}
.sec a{font-size:var(--text-subheadline);font-weight:600;color:var(--orchid-deep)}
.crown{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--plum-deep);color:var(--gold)}


.coin{width:var(--s,20px);height:var(--s,20px);border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;color:#fff;
  background:radial-gradient(circle at 35% 30%,#FFE0A0,var(--gold) 58%,#D98E1A);box-shadow:inset 0 0 0 2px rgba(255,255,255,.38)}
.nav{position:sticky;top:0;z-index:10;padding:calc(59px + 8px) 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.nav .mid{flex:1;text-align:center;font-size:var(--text-body);font-weight:700;color:var(--plum-deep);letter-spacing:-.01em}
.wallet{height:40px;padding:0 14px 0 8px;border-radius:20px;background:#fff;box-shadow:0 2px 10px rgba(77,22,85,.10);display:flex;align-items:center;gap:8px;
  font-size:var(--text-body);font-weight:700;color:var(--plum-deep);border:none}
.ovl{display:flex}.ovl .av{box-shadow:0 0 0 3px #fff}.ovl .av+.av{margin-left:-12px}
.pd{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:var(--text-caption2);font-weight:700;letter-spacing:.02em}
.tag.free{background:var(--ok-bg);color:#1B8A4F}
.tag.soon{background:var(--blush);color:var(--orchid-deep)}

.chips{display:flex;gap:8px;padding:6px 20px 0;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.prog{display:flex;align-items:center;gap:12px;padding:18px 24px 0}
.prog span{font-size:var(--text-footnote);font-weight:600;color:var(--muted);white-space:nowrap}
.qcard{margin:16px 20px 0;padding:26px 24px 24px;border-radius:32px;background:linear-gradient(150deg,#5E1D68,#3A1042);color:#fff;position:relative;overflow:hidden;min-height:250px;display:flex;flex-direction:column}
.qcard .kick{display:inline-flex;align-items:center;gap:6px;font-size:var(--text-caption1);font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--orchid-soft)}
.qcard h2{font-size:29px;line-height:1.14;letter-spacing:-.03em;margin:14px 0 0;font-weight:700;position:relative}
.qcard .deco{position:absolute;right:-30px;bottom:-44px;color:rgba(217,133,208,.22)}
.qcard .foot{margin-top:auto;padding-top:18px;font-size:var(--text-footnote);color:rgba(255,255,255,.7);display:flex;align-items:center;gap:8px;position:relative}
.ans{margin:14px 20px 0;padding:16px;display:flex;gap:12px;align-items:flex-start;position:relative}
.ans .tx{flex:1}.ans b{display:flex;align-items:center;gap:8px;font-size:var(--text-footnote);color:var(--muted);font-weight:600;margin-bottom:4px}
.ans p{font-size:var(--text-body);line-height:1.35;color:var(--plum-deep)}
.ans.mine{background:var(--blush-50);box-shadow:inset 0 0 0 1px var(--line)}
.ans.theirs p{transition:filter .25s}
.ans.theirs.hid p{filter:blur(7px);user-select:none}
.reveal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;border:none;background:none}
.ans.theirs.hid .reveal{display:flex}
.reveal span{height:40px;padding:0 18px;border-radius:20px;background:var(--plum);color:#fff;font-weight:600;font-size:var(--text-subheadline);display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-btn)}
.actions{position:sticky;bottom:0;margin-top:auto;padding:14px 20px 40px;display:flex;gap:10px;align-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,0),#fff 38%)}
.actions .btn{flex:1}

    </style>
</head>
<body>

        <div class="dynamic-island"></div>

            </div>
        </div>

        <!-- Insert screen content here -->
        <main class="device-content">
<div class="screen wash" style="min-height:932px">
  <header class="nav">
    <button class="ibtn" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <span class="mid">Deep Talk</span>
    <button class="ibtn" aria-label="Shuffle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg></button>
  </header>
  <div class="chips"><button class="chip ">All</button><button class="chip ">Dreams</button><button class="chip ">Memories</button><button class="chip on">Us</button><button class="chip ">Future</button><button class="chip ">Playful</button></div>
  <div class="prog"><div class="seg"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><span>3 of 10</span></div>
  <section class="qcard">
    <span class="deco"><svg width="190" height="190" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></span>
    <span class="kick"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21.2 10.6 20C5.4 15.3 2 12.2 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.700-3.400 6.800-8.600 11.500z"/></svg>Us</span>
    <h2>What's a small thing I do that makes you feel loved?</h2>
    <div class="foot"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>You both answered</div>
  </section>
  <section class="card ans mine"><img class="av" style="width:36px;height:36px" src="assets/everlove-memoji-linh.jpg" alt="Linh"><div class="tx"><b>You</b><p>When you pull the blanket over my feet without waking me.</p></div></section>
  <section class="card ans theirs hid" id="theirs"><img class="av" style="width:36px;height:36px" src="assets/everlove-memoji-partner.jpg" alt="Minh"><div class="tx"><b>Minh</b><p>That you remember how I take my coffee, every single time.</p></div>
    <button class="reveal" onclick="document.getElementById('theirs').classList.remove('hid')" aria-label="Reveal Minh's answer"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>Reveal Minh's answer</span></button></section>
