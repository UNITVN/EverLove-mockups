<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EverLove - Camera send (solo)</title>
    <link rel="stylesheet" href=".design/device-chrome.css">
    <link rel="stylesheet" href=".design/device-ios.css">
    <link rel="stylesheet" href=".design/everlove.css">
    <style>
        /* Per-mockup design tokens. design-system.html (if present in the
           working directory) overrides these. Keep in sync with
           components/ios/01-base-tokens.md. */
        :root {
            --color-bg: #FFFFFF;
            --color-text: #000000;
            --color-text-secondary: #6B7280;
            --color-island: #000000;
            --font-system: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            /* iOS HIG type ramp */
            --text-caption2:    11px;
            --text-caption1:    12px;
            --text-footnote:    13px;
            --text-subheadline: 15px;
            --text-callout:     16px;
            --text-body:        17px;
            --text-title3:      20px;
            --text-title2:      22px;
            --text-title1:      28px;
            --text-largetitle:  34px;
            --text-md:          var(--text-body);
        }

:root{
  --color-bg:#FFFFFF; --color-text:#2A0F2E; --color-text-secondary:#85708A;
  --plum:#4D1655; --plum-deep:#2F0D36; --plum-700:#6A2573;
  --orchid:#D985D0; --orchid-deep:#B95AB0; --orchid-soft:#EEC3E9;
  --blush:#F8E3F5; --blush-50:#FDF4FC; --line:#F0DEEC;
  --ink:#2A0F2E; --muted:#85708A;
  --ok:#2FB26B; --ok-bg:#E3F6EB; --gold:#F2B03B; --rose:#F0507F;
  --shadow-card:0 6px 24px rgba(77,22,85,.08);
  --shadow-btn:0 8px 20px rgba(77,22,85,.28);
}
.device{color:var(--ink)}
.screen{min-height:932px;display:flex;flex-direction:column;position:relative}
.wash{background:linear-gradient(180deg,#F5CFF0 0%,#FAE4F7 28%,#FFFFFF 62%)}
.av{border-radius:50%;display:block;flex-shrink:0}
button{font-family:inherit;color:inherit}

.t-large{font-size:var(--text-largetitle);font-weight:700;line-height:1.08;letter-spacing:-.03em;color:var(--plum-deep)}
.t-title{font-size:var(--text-title1);font-weight:700;line-height:1.14;letter-spacing:-.028em;color:var(--plum-deep)}
.t-sub{font-size:var(--text-subheadline);line-height:1.35;color:var(--muted)}

.btn{height:54px;width:100%;border:none;border-radius:27px;font-size:var(--text-body);font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn-plum{background:var(--plum);color:#fff;box-shadow:var(--shadow-btn)}
.btn-soft{background:rgba(255,255,255,.72);color:var(--plum);box-shadow:inset 0 0 0 1px rgba(77,22,85,.10)}
.btn-orchid{background:var(--orchid);color:var(--plum-deep)}
.btn-white{background:#fff;color:var(--plum)}
.btn[disabled]{opacity:.4;box-shadow:none}
.link{background:none;border:none;font-size:var(--text-subheadline);font-weight:600;color:var(--plum);cursor:pointer;min-height:44px}

.ibtn{width:44px;height:44px;border-radius:50%;border:none;background:#fff;color:var(--plum);
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(77,22,85,.10);cursor:pointer;position:relative;flex-shrink:0}
.ibtn.ghost{background:none;box-shadow:none}
.dot{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 2px #fff}

.card{background:#fff;border-radius:24px;box-shadow:var(--shadow-card)}
.chip{height:32px;padding:0 12px;border-radius:16px;background:var(--blush);color:var(--plum);
  font-size:var(--text-footnote);font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:none}
.chip.on{background:var(--plum);color:#fff}
.chip svg{flex-shrink:0}
.seg{display:flex;gap:6px;flex:1}
.seg i{flex:1;height:4px;border-radius:2px;background:rgba(77,22,85,.14)}
.seg i.on{background:var(--plum)}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:0 20px 12px}
.sec h2{font-size:var(--text-title3);font-weight:700;letter-spacing:-.02em;color:var(--plum-deep)}
.sec a{font-size:var(--text-subheadline);font-weight:600;color:var(--orchid-deep)}
.crown{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--plum-deep);color:var(--gold)}


@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Camera send screen: captured photo on top, "Send to" sheet at the bottom */
.send{position:relative;height:932px;overflow:hidden}
.send .nav{position:absolute;z-index:5;top:59px;left:16px;right:16px;height:44px;display:flex;align-items:center;justify-content:center}
.send .nav h1{font-size:var(--text-body);font-weight:700;color:var(--plum-deep)}
.send .nav .retake{position:absolute;left:0;height:44px;padding:0 16px 0 10px;border-radius:22px;background:#fff;color:var(--plum);border:none;box-shadow:0 2px 10px rgba(77,22,85,.10);display:flex;align-items:center;gap:4px;font-size:var(--text-subheadline);font-weight:600;cursor:pointer}
.send .photo{position:absolute;z-index:1;top:111px;left:16px;right:16px;height:490px;border-radius:28px;overflow:hidden;box-shadow:var(--shadow-card)}
.send .photo svg{width:100%;height:100%;display:block}
.send .tools{position:absolute;z-index:3;top:123px;right:28px;display:flex;flex-direction:column;gap:10px}
.glass{background:rgba(32,12,38,.46);color:#fff;border:none;-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.tbtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;font-weight:700;letter-spacing:-.02em}
.send .cap.glass{background:rgba(32,12,38,.58)}
.send .cap{position:absolute;z-index:3;left:28px;right:28px;top:507px;height:48px;border-radius:24px;display:flex;align-items:center;gap:10px;padding:0 16px 0 18px;font-size:var(--text-subheadline)}
.send .cap span.ph{flex:1;color:rgba(255,255,255,.82)}
.send .cap small{font-size:var(--text-caption1);color:rgba(255,255,255,.78);font-variant-numeric:tabular-nums}
.sheet{position:absolute;z-index:4;left:0;right:0;bottom:0;padding:8px 16px 34px;border-radius:28px 28px 0 0;background:#fff;box-shadow:0 -10px 34px rgba(77,22,85,.16)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;height:36px;margin-bottom:8px;padding:0 2px}
.sheet .hd h2{font-size:var(--text-title3);font-weight:700;letter-spacing:-.02em;color:var(--plum-deep)}
.place{position:relative;height:36px;padding:0 14px 0 10px;border-radius:18px;background:var(--blush);color:var(--plum);border:none;display:inline-flex;align-items:center;gap:6px;font-size:var(--text-footnote);font-weight:600;cursor:pointer}
.place::before{content:"";position:absolute;inset:-4px -2px}
.dest{display:flex;align-items:center;gap:12px;height:60px;margin-bottom:8px;padding:0 6px 0 8px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer;width:100%;border:none;text-align:left}
.dest.on{background:var(--blush-50);box-shadow:inset 0 0 0 1.5px var(--plum)}
.dest .ico{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dest .ico .ic{width:32px;height:32px;display:block}
.dest .tx{flex:1;min-width:0}
.dest b{display:flex;align-items:center;gap:6px;font-size:var(--text-callout);font-weight:600;color:var(--plum-deep)}
.dest span.s{display:block;font-size:var(--text-footnote);color:var(--muted);margin-top:1px}
.dest .ck{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dest .ck i{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px #D9C6D6;color:transparent}
.dest.on .ck i{background:var(--plum);box-shadow:none;color:#fff}
.dest .crown{width:18px;height:18px}
.sheet .btn{margin-top:6px}
/* Solo: Chat is locked until the partner joins (camera-spec section 7) */
.dest.locked{background:#FBF6FA;cursor:default}
.dest.locked .ico{filter:grayscale(.9);opacity:.5}
.dest.locked b{color:var(--muted)}
.dest.locked .crown{opacity:.55}
.dest.locked .ck i{background:var(--blush);box-shadow:none;color:var(--muted)}
.jm{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;background:var(--blush);color:var(--plum);font-size:var(--text-caption1);font-weight:700}
.invhint{display:flex;align-items:center;gap:10px;margin:2px 0 8px;padding:8px 8px 8px 14px;border-radius:16px;background:var(--blush-50);box-shadow:inset 0 0 0 1px var(--line);font-size:var(--text-footnote);line-height:1.3;color:var(--muted);transition:box-shadow .2s,background .2s}
.invhint span{flex:1}
.invhint button{flex-shrink:0;height:36px;padding:0 14px;border-radius:18px;border:none;background:var(--plum);color:#fff;font-size:var(--text-footnote);font-weight:600;cursor:pointer}
.invhint.pulse{background:var(--blush);box-shadow:inset 0 0 0 2px var(--orchid)}
@media (prefers-reduced-motion:reduce){.invhint{transition:none}}
