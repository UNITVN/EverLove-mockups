<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EverLove - Invite partner</title>
    <link rel="stylesheet" href=".design/device-chrome.css">
    <link rel="stylesheet" href=".design/device-ios.css">
    <style>
        /* Per-mockup design tokens. design-system.html (if present in the
           working directory) overrides these. Keep in sync with
           components/ios/01-base-tokens.md. */
        :root {
            --color-bg: #FFFFFF;
            --color-text: #000000;
            --color-text-secondary: #6B7280;
            --color-island: #000000;
            --font-system: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            /* iOS HIG type ramp */
            --text-caption2:    11px;
            --text-caption1:    12px;
            --text-footnote:    13px;
            --text-subheadline: 15px;
            --text-callout:     16px;
            --text-body:        17px;
            --text-title3:      20px;
            --text-title2:      22px;
            --text-title1:      28px;
            --text-largetitle:  34px;
            --text-md:          var(--text-body);
        }

:root{
  --color-bg:#FFFFFF; --color-text:#2A0F2E; --color-text-secondary:#85708A;
  --plum:#4D1655; --plum-deep:#2F0D36; --plum-700:#6A2573;
  --orchid:#D985D0; --orchid-deep:#B95AB0; --orchid-soft:#EEC3E9;
  --blush:#F8E3F5; --blush-50:#FDF4FC; --line:#F0DEEC;
  --ink:#2A0F2E; --muted:#85708A;
  --ok:#2FB26B; --ok-bg:#E3F6EB; --gold:#F2B03B; --rose:#F0507F;
  --shadow-card:0 6px 24px rgba(77,22,85,.08);
  --shadow-btn:0 8px 20px rgba(77,22,85,.28);
}
.device{color:var(--ink)}
.screen{min-height:932px;display:flex;flex-direction:column;position:relative}
.wash{background:linear-gradient(180deg,#F5CFF0 0%,#FAE4F7 28%,#FFFFFF 62%)}
.av{border-radius:50%;display:block;flex-shrink:0}
button{font-family:inherit;color:inherit}

.t-large{font-size:var(--text-largetitle);font-weight:700;line-height:1.08;letter-spacing:-.03em;color:var(--plum-deep)}
.t-title{font-size:var(--text-title1);font-weight:700;line-height:1.14;letter-spacing:-.028em;color:var(--plum-deep)}
.t-sub{font-size:var(--text-subheadline);line-height:1.35;color:var(--muted)}

.btn{height:54px;width:100%;border:none;border-radius:27px;font-size:var(--text-body);font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn-plum{background:var(--plum);color:#fff;box-shadow:var(--shadow-btn)}
.btn-soft{background:rgba(255,255,255,.72);color:var(--plum);box-shadow:inset 0 0 0 1px rgba(77,22,85,.10)}
.btn-orchid{background:var(--orchid);color:var(--plum-deep)}
.btn-white{background:#fff;color:var(--plum)}
.btn[disabled]{opacity:.4;box-shadow:none}
.link{background:none;border:none;font-size:var(--text-subheadline);font-weight:600;color:var(--plum);cursor:pointer;min-height:44px}

.ibtn{width:44px;height:44px;border-radius:50%;border:none;background:#fff;color:var(--plum);
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(77,22,85,.10);cursor:pointer;position:relative;flex-shrink:0}
.ibtn.ghost{background:none;box-shadow:none}
.dot{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 2px #fff}

.card{background:#fff;border-radius:24px;box-shadow:var(--shadow-card)}
.chip{height:32px;padding:0 12px;border-radius:16px;background:var(--blush);color:var(--plum);
  font-size:var(--text-footnote);font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:none}
.chip.on{background:var(--plum);color:#fff}
.chip svg{flex-shrink:0}
.seg{display:flex;gap:6px;flex:1}
.seg i{flex:1;height:4px;border-radius:2px;background:rgba(77,22,85,.14)}
.seg i.on{background:var(--plum)}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:0 20px 12px}
.sec h2{font-size:var(--text-title3);font-weight:700;letter-spacing:-.02em;color:var(--plum-deep)}
.sec a{font-size:var(--text-subheadline);font-weight:600;color:var(--orchid-deep)}
.crown{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--plum-deep);color:var(--gold)}

/* floating tab bar — recolored to the plum / orchid palette */
.float-tab-bar--icon-circle{box-shadow:0 10px 30px rgba(77,22,85,.16),0 2px 6px rgba(77,22,85,.06)}
.float-tab-bar--icon-circle .float-tab-item{color:#A98BAE}
.float-tab-bar--icon-circle .float-tab-item.active{background:var(--orchid);color:#fff}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.topbar{padding:calc(59px + 8px) 20px 0;display:flex;align-items:center;justify-content:space-between}
.head{padding:8px 24px 0;text-align:center}
.head .t-sub{margin-top:8px}
.pair{position:relative;height:170px;margin-top:12px}
.pair .l{position:absolute;left:64px;top:26px}
.pair .r{position:absolute;right:64px;top:26px}
.slot{width:104px;height:104px;border-radius:50%;border:2px dashed var(--orchid-deep);background:rgba(255,255,255,.6);color:var(--orchid-deep);
  display:flex;align-items:center;justify-content:center}
.pair svg.loop{position:absolute;inset:0;width:100%;height:100%}
.pair .hb{position:absolute;left:50%;top:60px;margin-left:-20px;width:40px;height:40px;border-radius:50%;background:var(--orchid-deep);color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(255,255,255,.7)}
.code{margin:6px 20px 0;padding:20px;text-align:center}
.code small{font-size:var(--text-footnote);color:var(--muted)}
.digits{display:flex;justify-content:center;gap:8px;margin:12px 0 16px}
.digits b{width:44px;height:56px;border-radius:14px;background:var(--blush);color:var(--plum-deep);font-size:26px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.row{display:flex;gap:10px}
.row .btn{height:50px}
.row .btn-soft{width:56px;flex:none;background:var(--blush);box-shadow:none}
.or{display:flex;align-items:center;gap:12px;margin:22px 40px 14px;color:var(--muted);font-size:var(--text-footnote)}
.or::before,.or::after{content:"";flex:1;height:1px;background:rgba(77,22,85,.14)}
.enter{margin:0 20px;display:flex;gap:10px}
.enter .inp{flex:1;height:50px;border-radius:25px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);padding:0 18px;display:flex;align-items:center;
  font-size:var(--text-body);color:#B79BBB}
.enter .btn{width:104px;height:50px;flex:none}
.notnow{margin-top:auto;padding:12px 0 44px;text-align:center}

    </style>
</head>
<body>
    <div class="device" data-platform="ios" data-form-factor="phone">
        <!-- Dynamic Island (always on top) -->
        <div class="dynamic-island"></div>

        <!-- Status Bar -->
        <div class="status-bar">
            <span class="status-bar-time">9:41</span>
            <div class="status-bar-icons">
                <svg width="20" height="13" viewBox="0 0 20 13" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M19.3466 1.625C19.3466 1.00368 18.8654 0.5 18.2718 0.5H17.1969C16.6033 0.5 16.1221 1.00368 16.1221 1.625V11.375C16.1221 11.9963 16.6033 12.5 17.1969 12.5H18.2718C18.8654 12.5 19.3466 11.9963 19.3466 11.375V1.625ZM11.8565 2.9H12.9313C13.5249 2.9 14.0061 3.41577 14.0061 4.052V11.348C14.0061 11.9842 13.5249 12.5 12.9313 12.5H11.8565C11.2629 12.5 10.7817 11.9842 10.7817 11.348V4.052C10.7817 3.41577 11.2629 2.9 11.8565 2.9ZM7.49008 5.5H6.41527C5.82167 5.5 5.34046 6.02233 5.34046 6.66667V11.3333C5.34046 11.9777 5.82167 12.5 6.41527 12.5H7.49008C8.08368 12.5 8.56489 11.9777 8.56489 11.3333V6.66667C8.56489 6.02233 8.08368 5.5 7.49008 5.5ZM2.14962 7.9H1.07481C0.481208 7.9 0 8.41487 0 9.05V11.35C0 11.9851 0.481208 12.5 1.07481 12.5H2.14962C2.74322 12.5 3.22443 11.9851 3.22443 11.35V9.05C3.22443 8.41487 2.74322 7.9 2.14962 7.9Z"/></svg>

                <svg width="27" height="13" viewBox="52.5 0 27 13" fill="none"><rect opacity="0.35" x="52.5474" y="0.5" width="24" height="12" rx="3.8" stroke="currentColor"/><path opacity="0.4" d="M77.9473 4.66666V8.66666C78.752 8.32788 79.2753 7.53979 79.2753 6.66666C79.2753 5.79352 78.752 5.00543 77.9473 4.66666Z" fill="currentColor"/><rect x="53.8474" y="2" width="21" height="9" rx="2.5" fill="currentColor"/></svg>
            </div>
        </div>

        <!-- Insert screen content here -->
        <main class="device-content">

<div class="screen wash">
  <div class="topbar">
    <button class="ibtn ghost" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="link">Help</button>
  </div>
  <div class="head">
    <h1 class="t-title">Invite your partner</h1>
    <p class="t-sub">EverLove works best with two. Send your code and your space opens the moment they join.</p>
  </div>
  <div class="pair">
    <svg class="loop" viewBox="0 0 430 170" fill="none" aria-hidden="true"><path d="M122 22C160 -10 270 -10 308 22" stroke="#D985D0" stroke-width="2" stroke-dasharray="4 7" stroke-linecap="round"/><path d="M122 148C160 180 270 180 308 148" stroke="#D985D0" stroke-width="2" stroke-dasharray="4 7" stroke-linecap="round"/></svg>
    <div class="l"><img class="av" src="assets/everlove-memoji-linh.jpg" alt="" width="104" height="104" style="width:104px;height:104px;object-fit:cover;box-shadow:0 0 0 3px #fff,0 0 0 5px #D985D0;"></div>
    <div class="hb"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.2 10.6 20C5.4 15.3 2 12.2 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.800 3 16.500 3 19.600 3 22 5.400 22 8.500c0 3.700-3.400 6.800-8.600 11.500z"/></svg></div>
    <div class="r"><div class="slot"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5v14"/></svg></div></div>
  </div>
  <div class="card code">
    <small>Your invite code</small>
    <div class="digits" aria-label="E V 7 K 3 Q"><b>E</b><b>V</b><b>7</b><b>K</b><b>3</b><b>Q</b></div>
    <div class="row">
      <button class="btn btn-plum"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/></svg> Send invite code</button>
      <button class="btn btn-soft" aria-label="Copy code"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
    </div>
  </div>
  <div class="or">Have a code from your partner?</div>
  <div class="enter"><div class="inp">Enter partner's code</div><button class="btn btn-soft">Connect</button></div>
  <div class="notnow"><button class="link">Not now</button></div>
</div>
        </main>

        <!-- Home Indicator -->
        <div class="home-indicator-area">
            <div class="home-indicator"></div>
        </div>
    </div>

    <!-- Figma export chrome (host page only; not serialized into the payload) -->
    <div class="figma-export-toolbar" data-figma-export-ignore>
        <span class="figma-export-toast" hidden></span>
        <button type="button" class="figma-export-btn" onclick="window.__copyDesignToFigma()">
            Copy to Figma
        </button>
    </div>

    <script src=".design/figma-export.js"></script>
