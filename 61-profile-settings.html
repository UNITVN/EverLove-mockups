<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EverLove - Profile and settings</title>
    <link rel="stylesheet" href=".design/device-chrome.css">
    <link rel="stylesheet" href=".design/device-ios.css">
    <link rel="stylesheet" href=".design/everlove.css">
    <style>
        /* Per-mockup design tokens. design-system.html (if present in the
           working directory) overrides these. Keep in sync with
           components/ios/01-base-tokens.md. */
        :root {
            --color-bg: #FFFFFF;
            --color-text: #000000;
            --color-text-secondary: #6B7280;
            --color-island: #000000;
            --font-system: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            /* iOS HIG type ramp */
            --text-caption2:    11px;
            --text-caption1:    12px;
            --text-footnote:    13px;
            --text-subheadline: 15px;
            --text-callout:     16px;
            --text-body:        17px;
            --text-title3:      20px;
            --text-title2:      22px;
            --text-title1:      28px;
            --text-largetitle:  34px;
            --text-md:          var(--text-body);
        }

:root{
  --color-bg:#FFFFFF; --color-text:#2A0F2E; --color-text-secondary:#85708A;
  --plum:#4D1655; --plum-deep:#2F0D36; --plum-700:#6A2573;
  --orchid:#D985D0; --orchid-deep:#B95AB0; --orchid-soft:#EEC3E9;
  --blush:#F8E3F5; --blush-50:#FDF4FC; --line:#F0DEEC;
  --ink:#2A0F2E; --muted:#85708A;
  --ok:#2FB26B; --ok-bg:#E3F6EB; --gold:#F2B03B; --rose:#F0507F;
  --shadow-card:0 6px 24px rgba(77,22,85,.08);
  --shadow-btn:0 8px 20px rgba(77,22,85,.28);
}
.device{color:var(--ink)}
.screen{min-height:932px;display:flex;flex-direction:column;position:relative}
.wash{background:linear-gradient(180deg,#F5CFF0 0%,#FAE4F7 28%,#FFFFFF 62%)}
.av{border-radius:50%;display:block;flex-shrink:0}
button{font-family:inherit;color:inherit}

.t-large{font-size:var(--text-largetitle);font-weight:700;line-height:1.08;letter-spacing:-.03em;color:var(--plum-deep)}
.t-title{font-size:var(--text-title1);font-weight:700;line-height:1.14;letter-spacing:-.028em;color:var(--plum-deep)}
.t-sub{font-size:var(--text-subheadline);line-height:1.35;color:var(--muted)}

.btn{height:54px;width:100%;border:none;border-radius:27px;font-size:var(--text-body);font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn-plum{background:var(--plum);color:#fff;box-shadow:var(--shadow-btn)}
.btn-soft{background:rgba(255,255,255,.72);color:var(--plum);box-shadow:inset 0 0 0 1px rgba(77,22,85,.10)}
.btn-orchid{background:var(--orchid);color:var(--plum-deep)}
.btn-white{background:#fff;color:var(--plum)}
.btn[disabled]{opacity:.4;box-shadow:none}
.link{background:none;border:none;font-size:var(--text-subheadline);font-weight:600;color:var(--plum);cursor:pointer;min-height:44px}

.ibtn{width:44px;height:44px;border-radius:50%;border:none;background:#fff;color:var(--plum);
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(77,22,85,.10);cursor:pointer;position:relative;flex-shrink:0}
.ibtn.ghost{background:none;box-shadow:none}
.dot{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 2px #fff}

.card{background:#fff;border-radius:24px;box-shadow:var(--shadow-card)}
.chip{height:32px;padding:0 12px;border-radius:16px;background:var(--blush);color:var(--plum);
  font-size:var(--text-footnote);font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:none}
.chip.on{background:var(--plum);color:#fff}
.chip svg{flex-shrink:0}
.seg{display:flex;gap:6px;flex:1}
.seg i{flex:1;height:4px;border-radius:2px;background:rgba(77,22,85,.14)}
.seg i.on{background:var(--plum)}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:0 20px 12px}
.sec h2{font-size:var(--text-title3);font-weight:700;letter-spacing:-.02em;color:var(--plum-deep)}
.sec a{font-size:var(--text-subheadline);font-weight:600;color:var(--orchid-deep)}
.crown{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--plum-deep);color:var(--gold)}


@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.page-header{padding:calc(59px + 8px) 20px 12px;display:flex;align-items:flex-end;justify-content:space-between}
.page-header .t-sub{margin-top:4px}
.add{width:48px;height:48px;border-radius:50%;background:var(--plum);color:#fff;border:none;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-btn)}
.filters{display:flex;gap:8px;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.filters .chip{height:36px;padding:0 16px;font-size:var(--text-subheadline)}
.day{padding:22px 20px 10px;font-size:var(--text-footnote);color:var(--muted);font-weight:600}
.post{margin:0 20px 16px;padding:10px 10px 14px}
.ph{height:260px;border-radius:18px;overflow:hidden;position:relative}
.ph svg{width:100%;height:100%;display:block}
.by{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:22px;background:rgba(47,13,54,.5);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff}
.by b{display:block;font-size:var(--text-footnote);line-height:1.1}.by span{font-size:var(--text-caption2);opacity:.8}
.post p{padding:12px 8px 8px;font-size:var(--text-body);line-height:1.35;color:var(--plum-deep)}
.meta{display:flex;align-items:center;gap:14px;padding:0 8px}
.meta .chip{margin-right:auto}
.act{display:flex;align-items:center;gap:5px;font-size:var(--text-subheadline);font-weight:600;color:var(--rose)}
.act.mu{color:var(--muted)}
.act .pav{width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 2px #fff;margin-left:-1px}


.pf{display:flex;flex-direction:column;align-items:center;padding:4px 20px 6px}
.pf .ph2{position:relative;width:104px;height:104px}
.pf .edit{position:absolute;right:-2px;bottom:-2px;width:44px;height:44px;border:none;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.pf .edit span{width:32px;height:32px;border-radius:50%;background:var(--plum);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff}
.pf .nm{margin-top:10px;font-size:var(--text-title2);font-weight:700;letter-spacing:-.02em;color:var(--plum-deep)}
.grp{margin:22px 20px 0}
.grp h4{font-size:var(--text-caption1);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 16px 8px}
.grp .card{padding:0 16px;border-radius:20px}
.li{display:flex;align-items:center;gap:14px;min-height:56px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li .ico{width:32px;height:32px;border-radius:10px;background:var(--blush-50);color:var(--plum);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.li .tx{flex:1;font-size:var(--text-body);color:var(--plum-deep);min-width:0}
.li .tx small{display:block;font-size:var(--text-footnote);color:var(--muted);margin-top:1px}
.li .r{font-size:var(--text-subheadline);color:var(--muted);display:flex;align-items:center;gap:4px}
.tg{width:51px;height:31px;border-radius:16px;background:#E5D8E3;position:relative;flex-shrink:0;border:none;padding:0}
.tg::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.22);transition:transform .2s}
.tg.on{background:var(--plum)}
.tg.on::after{transform:translateX(20px)}
.out{width:100%;border:none;background:none;min-height:56px;font-size:var(--text-body);font-weight:600;color:var(--rose);cursor:pointer;display:block}

    </style>
</head>
<body>
