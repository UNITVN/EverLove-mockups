<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EverLove - Profile</title>
    <link rel="stylesheet" href=".design/device-chrome.css">
    <link rel="stylesheet" href=".design/device-ios.css">
    <style>
        /* Per-mockup design tokens. design-system.html (if present in the
           working directory) overrides these. Keep in sync with
           components/ios/01-base-tokens.md. */
        :root {
            --color-bg: #FFFFFF;
            --color-text: #000000;
            --color-text-secondary: #6B7280;
            --color-island: #000000;
            --font-system: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            /* iOS HIG type ramp */
            --text-caption2:    11px;
            --text-caption1:    12px;
            --text-footnote:    13px;
            --text-subheadline: 15px;
            --text-callout:     16px;
            --text-body:        17px;
            --text-title3:      20px;
            --text-title2:      22px;
            --text-title1:      28px;
            --text-largetitle:  34px;
            --text-md:          var(--text-body);
        }

:root{
  --color-bg:#FFFFFF; --color-text:#2A0F2E; --color-text-secondary:#85708A;
  --plum:#4D1655; --plum-deep:#2F0D36; --plum-700:#6A2573;
  --orchid:#D985D0; --orchid-deep:#B95AB0; --orchid-soft:#EEC3E9;
  --blush:#F8E3F5; --blush-50:#FDF4FC; --line:#F0DEEC;
  --ink:#2A0F2E; --muted:#85708A;
  --ok:#2FB26B; --ok-bg:#E3F6EB; --gold:#F2B03B; --rose:#F0507F;
  --shadow-card:0 6px 24px rgba(77,22,85,.08);
  --shadow-btn:0 8px 20px rgba(77,22,85,.28);
}
.device{color:var(--ink)}
.screen{min-height:932px;display:flex;flex-direction:column;position:relative}
.wash{background:linear-gradient(180deg,#F5CFF0 0%,#FAE4F7 28%,#FFFFFF 62%)}
.av{border-radius:50%;display:block;flex-shrink:0}
button{font-family:inherit;color:inherit}

.t-large{font-size:var(--text-largetitle);font-weight:700;line-height:1.08;letter-spacing:-.03em;color:var(--plum-deep)}
.t-title{font-size:var(--text-title1);font-weight:700;line-height:1.14;letter-spacing:-.028em;color:var(--plum-deep)}
.t-sub{font-size:var(--text-subheadline);line-height:1.35;color:var(--muted)}

.btn{height:54px;width:100%;border:none;border-radius:27px;font-size:var(--text-body);font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn-plum{background:var(--plum);color:#fff;box-shadow:var(--shadow-btn)}
.btn-soft{background:rgba(255,255,255,.72);color:var(--plum);box-shadow:inset 0 0 0 1px rgba(77,22,85,.10)}
.btn-orchid{background:var(--orchid);color:var(--plum-deep)}
.btn-white{background:#fff;color:var(--plum)}
.btn[disabled]{opacity:.4;box-shadow:none}
.link{background:none;border:none;font-size:var(--text-subheadline);font-weight:600;color:var(--plum);cursor:pointer;min-height:44px}

.ibtn{width:44px;height:44px;border-radius:50%;border:none;background:#fff;color:var(--plum);
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(77,22,85,.10);cursor:pointer;position:relative;flex-shrink:0}
.ibtn.ghost{background:none;box-shadow:none}
.dot{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 2px #fff}

.card{background:#fff;border-radius:24px;box-shadow:var(--shadow-card)}
.chip{height:32px;padding:0 12px;border-radius:16px;background:var(--blush);color:var(--plum);
  font-size:var(--text-footnote);font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:none}
.chip.on{background:var(--plum);color:#fff}
.chip svg{flex-shrink:0}
.seg{display:flex;gap:6px;flex:1}
.seg i{flex:1;height:4px;border-radius:2px;background:rgba(77,22,85,.14)}
.seg i.on{background:var(--plum)}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:0 20px 12px}
.sec h2{font-size:var(--text-title3);font-weight:700;letter-spacing:-.02em;color:var(--plum-deep)}
.sec a{font-size:var(--text-subheadline);font-weight:600;color:var(--orchid-deep)}
.crown{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--plum-deep);color:var(--gold)}

/* floating tab bar — recolored to the plum / orchid palette */
.float-tab-bar--icon-circle{box-shadow:0 10px 30px rgba(77,22,85,.16),0 2px 6px rgba(77,22,85,.06)}
.float-tab-bar--icon-circle .float-tab-item{color:#A98BAE}
.float-tab-bar--icon-circle .float-tab-item.active{background:var(--orchid);color:#fff}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.topbar{padding:calc(59px + 8px) 20px 8px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10;
  background:linear-gradient(180deg,#F5CFF0,rgba(245,207,240,.92))}
.skip{height:32px;padding:0 14px;border-radius:16px;border:none;background:rgba(255,255,255,.7);color:var(--plum);font-size:var(--text-footnote);font-weight:600}
.head{padding:20px 24px 0}
.head .t-sub{margin-top:8px}
.me{display:flex;flex-direction:column;align-items:center;margin-top:24px}
.me .wrap{position:relative}
.edit{position:absolute;right:-2px;bottom:2px;width:36px;height:36px;border-radius:50%;background:var(--plum);color:#fff;border:3px solid #fff;
  display:flex;align-items:center;justify-content:center}
.field{margin:22px 40px 0;border-bottom:2px solid var(--plum);padding:6px 0 10px;text-align:center}
.field small{display:block;font-size:var(--text-caption1);color:var(--muted);margin-bottom:2px}
.field span{font-size:28px;font-weight:700;letter-spacing:-.02em;color:var(--plum-deep)}
.field span::after{content:"";display:inline-block;width:2px;height:26px;background:var(--orchid-deep);margin-left:2px;vertical-align:-4px}
.pick-title{margin:28px 24px 12px;font-size:var(--text-footnote);color:var(--muted)}
.picks{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:0 24px}
.pick{border:none;background:none;padding:0;position:relative;display:flex;justify-content:center;min-height:64px}
.pick.sel .av{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--orchid-deep)}
.tick{position:absolute;right:2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--orchid-deep);color:#fff;
  display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.foot{margin-top:auto;padding:20px 20px 44px}
.foot p{text-align:center;font-size:var(--text-caption1);color:var(--muted);margin-bottom:14px;line-height:1.4}

    </style>
</head>
<body>

            </div>
        </div>

        <!-- Insert screen content here -->
        <main class="device-content">

<div class="screen wash">
  <div class="topbar">
    <button class="ibtn ghost" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="seg"><i class="on"></i><i class="on"></i><i></i><i></i><i></i></div>
    <button class="skip">Skip</button>
  </div>
  <div class="head">
    <h1 class="t-title">What should we call you?</h1>
    <p class="t-sub">This is the name your partner sees.</p>
  </div>
  <div class="me">
    <div class="wrap"><img class="av" src="assets/everlove-memoji-linh.jpg" alt="" width="124" height="124" style="width:124px;height:124px;object-fit:cover;box-shadow:0 0 0 3px #fff,0 0 0 5px #D985D0;"><span class="edit"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></span></div>
  </div>
  <div class="field"><small>Your name</small><span>Linh</span></div>
  <p class="pick-title">Or pick an avatar</p>
  <div class="picks">
    <button class="pick" aria-label="Avatar 1"><img class="av" src="assets/everlove-memoji-01.jpg" alt="" width="64" height="64" style="width:64px;height:64px;object-fit:cover;"></button>

    <button class="pick" aria-label="Avatar 3"><img class="av" src="assets/everlove-memoji-03.jpg" alt="" width="64" height="64" style="width:64px;height:64px;object-fit:cover;"></button>
    <button class="pick" aria-label="Avatar 4"><img class="av" src="assets/everlove-memoji-04.jpg" alt="" width="64" height="64" style="width:64px;height:64px;object-fit:cover;"></button>
    <button class="pick" aria-label="Avatar 5"><img class="av" src="assets/everlove-memoji-05.jpg" alt="" width="64" height="64" style="width:64px;height:64px;object-fit:cover;"></button>
    <button class="pick" aria-label="Avatar 6"><img class="av" src="assets/everlove-memoji-06.jpg" alt="" width="64" height="64" style="width:64px;height:64px;object-fit:cover;"></button>
    <button class="pick sel" aria-label="Avatar 7"><img class="av" src="assets/everlove-memoji-linh.jpg" alt="" width="64" height="64" style="width:64px;height:64px;object-fit:cover;"><span class="tick"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></button>

    <p>Your details stay private and are only shared with your partner.</p>
    <button class="btn btn-plum">Continue</button>

</div>

        <!-- Home Indicator -->
        <div class="home-indicator-area">
            <div class="home-indicator"></div>
        </div>
    </div>

    <!-- Figma export chrome (host page only; not serialized into the payload) -->
