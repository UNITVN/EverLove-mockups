<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EverLove - Quiz result (no partner)</title>
    <link rel="stylesheet" href=".design/device-chrome.css">
    <link rel="stylesheet" href=".design/device-ios.css">
    <style>
        /* Per-mockup design tokens. design-system.html (if present in the
           working directory) overrides these. Keep in sync with
           components/ios/01-base-tokens.md. */
        :root {
            --color-bg: #FFFFFF;
            --color-text: #000000;
            --color-text-secondary: #6B7280;
            --color-island: #000000;
            --font-system: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            /* iOS HIG type ramp */
            --text-caption2:    11px;
            --text-caption1:    12px;
            --text-footnote:    13px;
            --text-subheadline: 15px;
            --text-callout:     16px;
            --text-body:        17px;
            --text-title3:      20px;
            --text-title2:      22px;
            --text-title1:      28px;
            --text-largetitle:  34px;
            --text-md:          var(--text-body);
        }

:root{
  --color-bg:#FFFFFF; --color-text:#2A0F2E; --color-text-secondary:#85708A;
  --plum:#4D1655; --plum-deep:#2F0D36; --plum-700:#6A2573;
  --orchid:#D985D0; --orchid-deep:#B95AB0; --orchid-soft:#EEC3E9;
  --blush:#F8E3F5; --blush-50:#FDF4FC; --line:#F0DEEC;
  --ink:#2A0F2E; --muted:#85708A;
  --ok:#2FB26B; --ok-bg:#E3F6EB; --gold:#F2B03B; --rose:#F0507F;
  --shadow-card:0 6px 24px rgba(77,22,85,.08);
  --shadow-btn:0 8px 20px rgba(77,22,85,.28);
}
.device{color:var(--ink)}
.screen{min-height:932px;display:flex;flex-direction:column;position:relative}
.wash{background:linear-gradient(180deg,#F5CFF0 0%,#FAE4F7 28%,#FFFFFF 62%)}
.av{border-radius:50%;display:block;flex-shrink:0}
button{font-family:inherit;color:inherit}

.t-large{font-size:var(--text-largetitle);font-weight:700;line-height:1.08;letter-spacing:-.03em;color:var(--plum-deep)}
.t-title{font-size:var(--text-title1);font-weight:700;line-height:1.14;letter-spacing:-.028em;color:var(--plum-deep)}
.t-sub{font-size:var(--text-subheadline);line-height:1.35;color:var(--muted)}

.btn{height:54px;width:100%;border:none;border-radius:27px;font-size:var(--text-body);font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn-plum{background:var(--plum);color:#fff;box-shadow:var(--shadow-btn)}
.btn-soft{background:rgba(255,255,255,.72);color:var(--plum);box-shadow:inset 0 0 0 1px rgba(77,22,85,.10)}
.btn-orchid{background:var(--orchid);color:var(--plum-deep)}
.btn-white{background:#fff;color:var(--plum)}
.btn[disabled]{opacity:.4;box-shadow:none}
.link{background:none;border:none;font-size:var(--text-subheadline);font-weight:600;color:var(--plum);cursor:pointer;min-height:44px}

.ibtn{width:44px;height:44px;border-radius:50%;border:none;background:#fff;color:var(--plum);
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(77,22,85,.10);cursor:pointer;position:relative;flex-shrink:0}
.ibtn.ghost{background:none;box-shadow:none}
.dot{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 2px #fff}

.card{background:#fff;border-radius:24px;box-shadow:var(--shadow-card)}
.chip{height:32px;padding:0 12px;border-radius:16px;background:var(--blush);color:var(--plum);
  font-size:var(--text-footnote);font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:none}
.chip.on{background:var(--plum);color:#fff}
.chip svg{flex-shrink:0}
.seg{display:flex;gap:6px;flex:1}
.seg i{flex:1;height:4px;border-radius:2px;background:rgba(77,22,85,.14)}
.seg i.on{background:var(--plum)}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:0 20px 12px}
.sec h2{font-size:var(--text-title3);font-weight:700;letter-spacing:-.02em;color:var(--plum-deep)}
.sec a{font-size:var(--text-subheadline);font-weight:600;color:var(--orchid-deep)}
.crown{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--plum-deep);color:var(--gold)}

/* floating tab bar — recolored to the plum / orchid palette */
.float-tab-bar--icon-circle{box-shadow:0 10px 30px rgba(77,22,85,.16),0 2px 6px rgba(77,22,85,.06)}
.float-tab-bar--icon-circle .float-tab-item{color:#A98BAE}
.float-tab-bar--icon-circle .float-tab-item.active{background:var(--orchid);color:#fff}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.head{position:sticky;top:0;z-index:10;padding:calc(59px + 8px) 20px 10px;display:flex;align-items:center;justify-content:space-between;
  background:rgba(245,207,240,.82);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.head .ibtn.me{padding:0;overflow:hidden}
.days{height:40px;padding:0 16px 0 12px;border-radius:20px;background:#fff;box-shadow:0 2px 10px rgba(77,22,85,.10);display:flex;align-items:center;gap:8px;
  font-size:var(--text-subheadline);color:var(--muted)}
.days b{font-size:var(--text-body);color:var(--plum-deep);font-weight:700}
.days svg{color:var(--rose)}
.hero{margin:10px 20px 0;padding:22px 18px 16px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 0%,#FBE3F7 0%,rgba(255,255,255,0) 70%)}
.pair{position:relative;display:flex;align-items:flex-start;justify-content:space-between;padding:0 14px}
.who{display:flex;flex-direction:column;align-items:center;gap:8px;width:110px;position:relative}
.who .nm{font-size:var(--text-body);font-weight:700;color:var(--plum-deep);display:flex;align-items:center;gap:6px}
.who .on{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.who .st{position:absolute;top:-14px;padding:5px 11px;border-radius:14px;background:var(--plum);color:#fff;font-size:var(--text-caption1);font-weight:600;white-space:nowrap}
.who .st.you{background:#fff;color:var(--plum);box-shadow:0 4px 12px rgba(77,22,85,.12)}
.mid{position:absolute;left:0;right:0;top:56px;display:flex;justify-content:center}
.mid svg.line{position:absolute;top:18px;left:132px;width:106px;height:24px}
.mid .hb{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#F7A6E8,var(--orchid-deep));color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 6px rgba(217,133,208,.18)}
.stats{position:relative;display:flex;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.stats div{flex:1;text-align:center}
.stats b{display:block;font-size:var(--text-body);font-weight:700;color:var(--plum-deep)}
.stats span{font-size:var(--text-caption1);color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 20px;margin-top:22px}
.tile{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:var(--text-footnote);font-weight:600;color:var(--plum-deep);min-height:44px}
.tile .ico{width:68px;height:68px;border-radius:22px;background:#fff;box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center;color:var(--plum)}
.tile.k1 .ico{background:var(--plum);color:#fff}
.quiz{margin:22px 20px 0;padding:22px;border-radius:28px;background:linear-gradient(135deg,#5E1D68,#3A1042);color:#fff;position:relative;overflow:hidden}
.quiz .kick{font-size:var(--text-caption1);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--orchid-soft)}
.quiz h3{font-size:22px;line-height:1.15;letter-spacing:-.025em;margin:8px 0 6px;max-width:230px}
.quiz p{font-size:var(--text-subheadline);color:rgba(255,255,255,.72)}
.quiz .btn{width:auto;display:inline-flex;height:44px;padding:0 20px;margin-top:16px;font-size:var(--text-subheadline)}
.quiz .deco{position:absolute;right:-22px;bottom:-26px;color:rgba(217,133,208,.28)}
.quiz .deco2{position:absolute;right:62px;top:20px;color:rgba(217,133,208,.5)}
.special{margin:14px 20px 0;padding:14px 16px;display:flex;align-items:center;gap:14px}
.special .ico{width:48px;height:48px;border-radius:16px;background:var(--blush);color:var(--plum);display:flex;align-items:center;justify-content:center}
.special .tx{flex:1}
.special b{display:block;font-size:var(--text-body);font-weight:600;color:var(--plum-deep)}
.special span{font-size:var(--text-footnote);color:var(--muted)}
.special .cnt{font-size:var(--text-footnote);font-weight:700;color:var(--orchid-deep);background:var(--blush-50);padding:6px 10px;border-radius:12px}

    
.ghost-av{border-radius:50%;border:2px dashed var(--orchid);background:rgba(255,255,255,.65);display:flex;align-items:center;justify-content:center;color:var(--orchid-deep);flex-shrink:0}
.ghost-av.plus{border-style:dashed;color:var(--plum)}
.lockchip{position:absolute;top:-5px;right:-5px;width:26px;height:26px;border-radius:50%;background:#fff;color:var(--plum);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(77,22,85,.20)}
.wait{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:15px;background:var(--blush);color:var(--plum);font-size:var(--text-footnote);font-weight:600;white-space:nowrap}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--orchid-deep);animation:pl 1.8s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(185,90,176,.55)}100%{box-shadow:0 0 0 10px rgba(185,90,176,0)}}
.hb.off{background:#F1E6F0;color:#B9A2BD;box-shadow:0 0 0 6px rgba(133,112,138,.10)}
.privacy{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:18px;background:var(--ok-bg);color:#1B6B42;font-size:var(--text-footnote);line-height:1.38}
.privacy svg{flex-shrink:0;margin-top:1px}
.privacy b{display:block;font-size:var(--text-subheadline);margin-bottom:2px}
.pad{padding:0 20px}
.digits{display:flex;gap:8px;justify-content:center}
.digits b{width:44px;height:56px;border-radius:14px;background:var(--blush-50);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;letter-spacing:0;color:var(--plum-deep);font-variant-numeric:tabular-nums}
.row2{display:flex;gap:10px}
.row2 .btn-soft{width:54px;flex-shrink:0;background:#fff}
.dash{border:1.5px dashed var(--orchid);background:rgba(255,255,255,.6);box-shadow:none}

.qtop{padding:calc(59px + 8px) 12px 0;display:flex;align-items:center;justify-content:space-between}
.res{padding:6px 24px 0;text-align:center;display:flex;flex-direction:column;align-items:center}
.ring{position:relative;width:196px;height:196px;margin:8px 0 0}
.ring svg.r{position:absolute;inset:0}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:44px;font-weight:700;letter-spacing:-.04em;color:var(--plum-deep)}
.ring .c span{font-size:var(--text-footnote);font-weight:600;color:var(--muted);margin-top:-2px}
.duo{display:flex;align-items:center;justify-content:center;margin-top:18px;position:relative;z-index:2}
.duo>*+*{margin-left:-14px}
.duo .av,.duo .ghost-av{box-shadow:0 0 0 4px #fff}
.res h1{margin-top:18px}.res p{margin:8px 0 16px;max-width:310px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:20px 20px 0}
.lk{position:relative;overflow:hidden;padding:16px 14px;border-radius:22px;min-height:150px}
.lk .t{font-size:var(--text-subheadline);font-weight:700;color:var(--plum-deep)}
.lk .bars{margin-top:14px;display:flex;flex-direction:column;gap:9px;filter:blur(4px);opacity:.75}
.lk .bars i{height:10px;border-radius:5px;background:var(--orchid-soft)}
.lk .bars i:nth-child(2){width:80%}.lk .bars i:nth-child(3){width:60%}
.lk .pad2{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;background:var(--plum);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(77,22,85,.3)}
.lk.b .bars i{background:#F7CFD9}
.qfoot{padding:22px 20px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.qfoot .fine{margin-top:8px;font-size:var(--text-footnote);color:var(--muted);display:flex;align-items:center;gap:6px;text-align:center}

    </style>
</head>
<body>

            </div>
        </div>

        <!-- Insert screen content here -->
        <main class="device-content">
<div class="screen wash" style="padding-bottom:40px">
  <div class="qtop"><button class="ibtn ghost" aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button><span class="wait"><i class="pulse"></i>Waiting for your partner</span><span style="width:44px"></span></div>
  <section class="res">
    <div class="ring"><svg class="r" viewBox="0 0 196 196" fill="none" aria-hidden="true"><circle cx="98" cy="98" r="88" stroke="#F0DEEC" stroke-width="12"/><circle cx="98" cy="98" r="88" stroke="#D985D0" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 22"/></svg>
      <div class="c"><b>?%</b><span>match</span></div></div>
    <div class="duo"><img class="av" src="assets/everlove-avatar-linh.jpg" alt="" width="64" height="64" style="width:64px;height:64px;object-fit:cover;"><span class="ghost-av plus" style="width:64px;height:64px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></span></div>
    <h1 class="t-title">You're all done</h1>
    <p class="t-sub">Your answers are saved. Your match shows up as soon as your partner answers too.</p>
  </section>
  <section class="two">
    <div class="card lk"><span class="t">Our strengths</span><div class="bars"><i></i><i></i><i></i></div><span class="pad2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span></div>
    <div class="card lk b"><span class="t">Worth exploring</span><div class="bars"><i></i><i></i><i></i></div><span class="pad2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span></div>
  </section>
  <section class="qfoot">
    <button class="btn btn-plum"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg> Invite your partner</button>
    <button class="link">Back to home</button>
    <div class="fine"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="M2 2l20 20"/></svg>Your answers stay hidden until you both finish.</div>
  </section>
</div>
        </main>


        <!-- Home Indicator -->
        <div class="home-indicator-area">
            <div class="home-indicator"></div>
        </div>
    </div>

    <!-- Figma export chrome (host page only; not serialized into the payload) -->
    <div class="figma-export-toolbar" data-figma-export-ignore>
        <span class="figma-export-toast" hidden></span>
        <button type="button" class="figma-export-btn" onclick="window.__copyDesignToFigma()">
            Copy to Figma
        </button>
